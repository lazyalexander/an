# Checked by tests/architecture.rs in a normal cargo test run.
[domain]
source = "src/provenance/domain.rs"
# The checker compiles the domain in isolation with only these Cargo dependencies.
dependencies = ["serde"]
negative_fixture = "tests/fixtures/provenance-sqlite.rs"

[provenance]
entries = { "src/main.rs" = "execute", "src/mcp.rs" = "execute_mcp" }
callers = ["src/main.rs", "src/mcp.rs"]
adapter_api = ["execute", "execute_mcp", "authenticate", "scoped", "export::run"]
storage_prefix = "pv_"

[core]
root = "src"
excluded_sources = ["examples", "studio"]

[workspace_inbox]
sources = ["src/workspace/inbox.rs", "src/workspace/inbox.sql"]
# Read frozen content via the public SQL projection and the registration lookup.
private_tables = ["pv_version", "pv_block", "pv_edge", "pv_choice"]
negative_fixture = "tests/fixtures/inbox-private-table.sql"

[retention]
consumer = "src/store/gc.rs"
