[package]
name = "an"
version = "0.5.0"
edition = "2021"
description = "Task-scoped MCP gateway and OCI spool scheduler"
license = "Apache-2.0"
include = ["/src/**", "/config/an.json", "/examples/krita-format/validator.rs", "/tests/native_core.rs", "/LICENSE", "/README.md", "/Cargo.lock"]
autoexamples = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.36", features = ["bundled"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
rmcp = { version = "3.7", default-features = false, features = ["server","client","transport-io","transport-child-process"] }
tokio = { version="1", features=["rt-multi-thread","time","process"] }
yaml-rust2 = "0.11"
tar = "0.4"
libc = "0.2"
regex = "1"
zip = { version = "9", optional = true, default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = { version = "0.39", optional = true }

[features]
default = ["krita-experiment"]
krita-experiment = ["dep:zip", "dep:quick-xml"]
