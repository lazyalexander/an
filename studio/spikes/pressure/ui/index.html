<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>pressure-spike</title>
<style>
  html, body { margin: 0; height: 100%; background: #222; color: #ddd;
               font: 12px monospace; }
  #pad { position: absolute; inset: 0 0 160px 0; touch-action: none; }
  #log { position: absolute; left: 0; right: 0; bottom: 0; height: 150px;
         margin: 0; padding: 6px; overflow-y: scroll; background: #111;
         white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="pad"></canvas>
<pre id="log"></pre>
<script>
  const canvas = document.getElementById('pad');
  const log = document.getElementById('log');
  const ctx = canvas.getContext('2d');
  let samples = 0;
  let pending = [];
  let flushTimer = null;

  function fit() {
    const r = canvas.getBoundingClientRect();
    canvas.width = Math.round(r.width * devicePixelRatio);
    canvas.height = Math.round(r.height * devicePixelRatio);
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  fit();
  addEventListener('resize', fit);

  function flush() {
    flushTimer = null;
    if (pending.length === 0) return;
    log.textContent += pending.join('\n') + '\n';
    pending = [];
    const lines = log.textContent.split('\n');
    if (lines.length > 300) {
      log.textContent = lines.slice(-300).join('\n');
    }
    log.scrollTop = log.scrollHeight;
  }

  function record(e) {
    samples++;
    pending.push(JSON.stringify({
      n: samples, type: e.type, pointerType: e.pointerType,
      pressure: e.pressure, buttons: e.buttons
    }));
    if (flushTimer === null) flushTimer = setTimeout(flush, 150);
    if (e.buttons > 0) {
      const r = 40 * e.pressure;
      ctx.beginPath();
      ctx.arc(e.offsetX, e.offsetY, r, 0, Math.PI * 2);
      ctx.fillStyle = '#7cf';
      ctx.fill();
    }
  }

  canvas.addEventListener('pointerdown', record);
  canvas.addEventListener('pointermove', record);
  canvas.addEventListener('pointerup', record);
</script>
</body>
</html>
