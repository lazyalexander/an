# Browser-callable graph operations. Privileged decisions have dedicated handlers.
[studio]
graph_actions = ["panel", "viewed", "draft", "respond", "open", "deliveries", "sources", "resume", "control", "instruct"]

# The HTTP layer may depend on the client only. Checked by the Studio test suite.
[architecture]
presentation = "orchestrator/graph_server.py"
host_imports = ["an_host.client"]
forbidden_imports = ["subprocess", "sqlite3", "orchestrator.runner"]
