schema: an.spool/v2
name: studio-sample
summary: Execute the reproducible Studio graph examples.
inputs:
  - name: source
    description: Selected upstream artifact
    media_types: [application/octet-stream]
    required: false
  - name: choice
    description: Versioned user response
    media_types: [application/json]
    required: false
outputs:
  - name: result
    description: Generated files
    media_types: [application/octet-stream]
panels:
  compare:
    title: 选择绘画参考
    kind: surface
    bindings: [A, B]
    html: spool/code/panels/compare.html
    decision: {type: choose, extra: {note: text, x: coordinate, y: coordinate}}
  edit:
    title: 添加第二次标注
    kind: surface
    bindings: [preview]
    html: spool/code/panels/edit.html
    decision: {type: point}
  report:
    title: 绘画参考与修改记录
    kind: delivery
    bindings: [original, selected, choice, painting]
    optional: [annotation]
    html: spool/code/panels/report.html
  timing:
    title: 设置零件旋转周期
    kind: surface
    bindings: []
    decision: {type: adjust, field: seconds, value_type: integer, options: [1, 2, 3, 4, 5], default: 3}
  sketch:
    title: 画一张草稿
    kind: surface
    bindings: []
    optional: [reference]
    decision: {type: sketch, extra: {note: text}}
  finished:
    title: 整理后的线稿
    kind: delivery
    bindings: [sketch, finished]
    optional: [painting]
  paint:
    title: 原生压感绘画
    kind: native
    adapter: krita
    bindings: [document]
